services:
  db:
    image: postgres:16
    container_name: kopipos_db
    restart: always
    # Semua nilai diambil dari file .env di root (tidak di-commit ke git)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kopipos}
      POSTGRES_USER: ${POSTGRES_USER:-kopipos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi di .env}
    # Port 5432 sengaja TIDAK dibuka ke host — backend akses via jaringan internal.
    volumes:
      - kopipos_postgres_data:/var/lib/postgresql/data
    networks:
      - kopipos_internal

  backend:
    build:
      context: ./backend
    container_name: kopipos_backend
    restart: always
    env_file:
      - .env
    environment:
      # Dirakit dari variabel POSTGRES_* di .env → password cukup ditulis sekali.
      # (Nilai ini mengalahkan DATABASE_URL jika ada di .env.)
      DATABASE_URL: postgresql://${POSTGRES_USER:-kopipos}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi di .env}@db:5432/${POSTGRES_DB:-kopipos}
      # Gambar produk & logo disimpan di volume, bukan di dalam container,
      # supaya tidak hilang saat rebuild / recreate.
      UPLOADS_DIR: /data/uploads
      QZ_PRIVATE_KEY_PATH: /run/secrets/qz-private-key.pem
    volumes:
      - kopipos_uploads:/data/uploads
      # Kunci tanda tangan QZ Tray (cetak struk) — dipasang read-only, tidak ikut di image.
      # File ini tidak di-commit; lokasinya bisa diubah lewat QZ_PRIVATE_KEY_FILE di .env.
      - ${QZ_PRIVATE_KEY_FILE:-./backend/private-key.pem}:/run/secrets/qz-private-key.pem:ro
    # Port 8000 sengaja TIDAK dibuka ke host — hanya diakses lewat
    # reverse proxy nginx di container frontend (/api, /uploads).
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - kopipos_internal

  frontend:
    build:
      context: ./frontend
    container_name: kopipos_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - kopipos_internal   # untuk proxy ke backend
      - shared_network     # untuk Nginx Proxy Manager

volumes:
  kopipos_postgres_data:
  kopipos_uploads:

networks:
  kopipos_internal:
    driver: bridge

  shared_network:
    external: true
