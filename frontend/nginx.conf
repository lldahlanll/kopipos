server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Batas ukuran upload (gambar produk, dll)
    client_max_body_size 10m;

    # IP asli pengunjung: request datang dari Nginx Proxy Manager (jaringan
    # Docker privat). Ambil IP paling kanan di X-Forwarded-For yang BUKAN proxy
    # tepercaya — header palsu dari pengunjung tidak bisa menimpanya.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # DNS internal Docker — resolve nama container saat request,
    # supaya nginx tidak gagal start bila backend belum siap.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://kopipos_backend:8000;

    # ─── Reverse proxy ke backend (jaringan internal Docker) ─────────────────
    # ^~ wajib: agar tidak tertangkap location regex cache statis di bawah.
    location ^~ /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 7d;
    }

    # Wajib untuk React Router (SPA) - redirect semua ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache file statis
    location ~* "\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Disable caching untuk index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
